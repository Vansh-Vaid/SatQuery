# Builds the SatQuery app image on GitHub's free runners and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/satquery:latest
# Azure Container Apps (or any Docker host) runs that image; see "Put it online" in the README.
# The trained models are not in git; they are downloaded from the "models-v1" release into checkpoints/.
name: Build app image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["satquery/**", "tests/**", "demo_data/**", "Dockerfile", ".dockerignore", "requirements.txt", "run.py", "pytest.ini",
            ".github/workflows/build-image.yml"]

permissions:
  contents: read
  packages: write

env:
  MODELS_RELEASE: models-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download trained models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoints
          gh release download "$MODELS_RELEASE" --dir checkpoints --pattern "*.pt" --pattern "*.json"
          ls -la checkpoints

      # Run the test suite (with the trained models, so model tests run instead of skipping)
      # before building; a failing test stops the image from being published.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Image name (lower case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/satquery" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
