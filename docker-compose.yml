# Self-host on any machine or server with Docker:   docker compose up -d   ->  http://localhost:8000
# Put trained models in checkpoints/ first (python run.py --setup-models); they are baked into the image.
services:
  satquery:
    build: .
    ports:
      - "8000:7860"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # optional: enables the Claude planner (read from your shell)
      SATQUERY_RATE_LIMIT: "20"                  # analyses per visitor per minute
      SATQUERY_MAX_CONCURRENT: "2"
      # trust X-Forwarded-For only from a reverse proxy on this machine (nginx/Caddy); use "*" behind a cloud proxy
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    restart: unless-stopped
    mem_limit: 4g
